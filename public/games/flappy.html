<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Flappy Bird</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
      overflow: hidden;
    }
    .header {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .title {
      font-size: 26px;
      font-weight: 800;
      color: #f59e0b;
    }
    .score-badge {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 4px 12px;
      border-radius: 8px;
      text-align: center;
    }
    .score-lbl { font-size: 10px; color: #94a3b8; font-weight: 600; text-transform: uppercase; }
    .score-num { font-size: 16px; font-weight: 700; color: #fbbf24; font-variant-numeric: tabular-nums; }
    #canvas-container {
      position: relative;
      width: min(92vw, 360px);
      height: min(138vw, 540px);
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #334155;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #38bdf8;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .btn {
      background: #f59e0b;
      color: #451a03;
      border: none;
      padding: 10px 24px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 14px;
      transition: transform 0.1s, background 0.15s;
    }
    .btn:hover { background: #fbbf24; transform: scale(1.03); }
    .footer-hints {
      margin-top: 10px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">Flappy Bird</div>
    <div class="score-badge">
      <div class="score-lbl">Best Score</div>
      <div id="best-score" class="score-num">0</div>
    </div>
  </div>

  <div id="canvas-container">
    <canvas id="flappyCanvas" width="360" height="540"></canvas>
    <div class="overlay active" id="game-overlay">
      <h2 style="font-size: 32px; font-weight: 800; color: #f59e0b;" id="overlay-title">Flappy Bird</h2>
      <p style="color: #cbd5e1; font-size: 14px; margin-top: 6px;" id="overlay-score-text">Tap or Press Space to Flap</p>
      <button class="btn" id="start-btn" onclick="startGame()">Start Game</button>
    </div>
  </div>

  <div class="footer-hints">Space / Click / Touch to Flap</div>

  <script>
    const canvas = document.getElementById('flappyCanvas');
    const ctx = canvas.getContext('2d');

    let birdY = 240;
    let birdVelocity = 0;
    const gravity = 0.35;
    const jump = -6.5;
    let pipes = [];
    let score = 0;
    let bestScore = parseInt(localStorage.getItem('flappy_best') || '0', 10);
    let isPlaying = false;
    let animationId = null;
    let frameCount = 0;

    document.getElementById('best-score').innerText = bestScore;

    function playBeep(freq, dur) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    function flap() {
      if (!isPlaying) {
        startGame();
        return;
      }
      birdVelocity = jump;
      playBeep(440, 0.08);
    }

    function startGame() {
      birdY = 240;
      birdVelocity = 0;
      pipes = [];
      score = 0;
      frameCount = 0;
      isPlaying = true;
      document.getElementById('game-overlay').classList.remove('active');
      if (animationId) cancelAnimationFrame(animationId);
      loop();
    }

    function gameOver() {
      isPlaying = false;
      playBeep(180, 0.35);
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('flappy_best', bestScore);
        document.getElementById('best-score').innerText = bestScore;
      }
      document.getElementById('overlay-title').innerText = 'Game Over';
      document.getElementById('overlay-score-text').innerText = `Score: ${score} · Best: ${bestScore}`;
      document.getElementById('start-btn').innerText = 'Play Again';
      document.getElementById('game-overlay').classList.add('active');
    }

    function loop() {
      if (!isPlaying) return;
      frameCount++;

      // Update Bird
      birdVelocity += gravity;
      birdY += birdVelocity;

      // Spawn pipes
      if (frameCount % 90 === 0) {
        const gap = 130;
        const topHeight = Math.floor(Math.random() * (canvas.height - gap - 160)) + 60;
        pipes.push({
          x: canvas.width,
          top: topHeight,
          bottom: topHeight + gap,
          passed: false
        });
      }

      // Update Pipes
      for (let i = pipes.length - 1; i >= 0; i--) {
        const p = pipes[i];
        p.x -= 2.2;

        // Collision check
        const birdX = 80;
        const birdRadius = 14;

        if (birdX + birdRadius > p.x && birdX - birdRadius < p.x + 52) {
          if (birdY - birdRadius < p.top || birdY + birdRadius > p.bottom) {
            gameOver();
            return;
          }
        }

        // Score
        if (!p.passed && p.x + 52 < birdX) {
          p.passed = true;
          score++;
          playBeep(660, 0.1);
        }

        if (p.x < -60) {
          pipes.splice(i, 1);
        }
      }

      // Ground or ceiling collision
      if (birdY + 14 >= canvas.height - 40 || birdY - 14 <= 0) {
        gameOver();
        return;
      }

      draw();
      animationId = requestAnimationFrame(loop);
    }

    function draw() {
      // Sky
      ctx.fillStyle = '#0284c7';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Clouds
      ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.beginPath();
      ctx.arc(100, 100, 30, 0, Math.PI * 2);
      ctx.arc(130, 90, 40, 0, Math.PI * 2);
      ctx.arc(160, 100, 30, 0, Math.PI * 2);
      ctx.fill();

      // Pipes
      pipes.forEach(p => {
        // Top Pipe
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(p.x, 0, 52, p.top);
        ctx.fillStyle = '#16a34a';
        ctx.fillRect(p.x - 3, p.top - 20, 58, 20);

        // Bottom Pipe
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(p.x, p.bottom, 52, canvas.height - p.bottom - 40);
        ctx.fillStyle = '#16a34a';
        ctx.fillRect(p.x - 3, p.bottom, 58, 20);
      });

      // Ground
      ctx.fillStyle = '#854d0e';
      ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
      ctx.fillStyle = '#15803d';
      ctx.fillRect(0, canvas.height - 40, canvas.width, 10);

      // Bird
      ctx.save();
      ctx.translate(80, birdY);
      ctx.rotate(Math.min(Math.PI / 4, Math.max(-Math.PI / 4, birdVelocity * 0.08)));

      // Bird Body
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.arc(0, 0, 14, 0, Math.PI * 2);
      ctx.fill();

      // Wing
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.ellipse(-4, 2, 7, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      // Eye
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(6, -4, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(7, -4, 2, 0, Math.PI * 2);
      ctx.fill();

      // Beak
      ctx.fillStyle = '#ea580c';
      ctx.beginPath();
      ctx.moveTo(11, -2);
      ctx.lineTo(19, 2);
      ctx.lineTo(11, 6);
      ctx.closePath();
      ctx.fill();

      ctx.restore();

      // In-game score
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 36px sans-serif';
      ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(0,0,0,0.5)';
      ctx.shadowBlur = 6;
      ctx.fillText(score, canvas.width / 2, 60);
      ctx.shadowBlur = 0;
    }

    window.addEventListener('keydown', e => {
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
        e.preventDefault();
        flap();
      }
    });

    canvas.addEventListener('pointerdown', e => {
      e.preventDefault();
      flap();
    });

    draw();
  </script>
</body>
</html>
