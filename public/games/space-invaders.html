<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Space Invaders</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #020617;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
      overflow: hidden;
    }
    .header {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .title {
      font-size: 24px;
      font-weight: 800;
      color: #22c55e;
      letter-spacing: 1px;
    }
    .stats {
      display: flex;
      gap: 10px;
    }
    .stat {
      background: #0f172a;
      border: 1px solid #1e293b;
      padding: 4px 10px;
      border-radius: 6px;
      text-align: center;
    }
    .stat-l { font-size: 9px; color: #64748b; font-weight: 700; text-transform: uppercase; }
    .stat-v { font-size: 15px; font-weight: 800; color: #4ade80; font-variant-numeric: tabular-nums; }
    #canvas-container {
      position: relative;
      border: 2px solid #1e293b;
      border-radius: 8px;
      box-shadow: 0 0 25px rgba(34, 197, 94, 0.15);
      background: #000;
    }
    canvas {
      display: block;
      background: #000;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .btn {
      background: #22c55e;
      color: #052e16;
      border: none;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 800;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 14px;
    }
    .btn:hover { background: #4ade80; }
    .help {
      margin-top: 10px;
      font-size: 11px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">SPACE INVADERS</div>
    <div class="stats">
      <div class="stat">
        <div class="stat-l">Score</div>
        <div id="score" class="stat-v">0</div>
      </div>
      <div class="stat">
        <div class="stat-l">Lives</div>
        <div id="lives" class="stat-v">3</div>
      </div>
    </div>
  </div>

  <div id="canvas-container">
    <canvas id="invCanvas" width="480" height="420"></canvas>
    <div class="overlay active" id="overlay">
      <h2 style="font-size: 32px; font-weight: 800; color: #22c55e;" id="overlay-title">Space Invaders</h2>
      <p style="color: #94a3b8; font-size: 13px; margin-top: 4px;" id="overlay-sub">Defend Earth from invading aliens!</p>
      <button class="btn" id="start-btn" onclick="startInvaders()">Start Game</button>
    </div>
  </div>

  <div class="help">Left / Right Arrows or A / D to move · Space to shoot</div>

  <script>
    const canvas = document.getElementById('invCanvas');
    const ctx = canvas.getContext('2d');

    let player = { x: 220, y: 390, w: 28, h: 16, speed: 4 };
    let bullets = [];
    let alienBullets = [];
    let aliens = [];
    let bunkers = [];
    let alienDir = 1;
    let alienSpeed = 0.8;
    let score = 0;
    let lives = 3;
    let isPlaying = false;
    let animId = null;

    function playTone(freq, dur) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    function initAliens() {
      aliens = [];
      const rows = 4;
      const cols = 8;
      const alienW = 24;
      const alienH = 18;
      const padX = 18;
      const padY = 16;
      const startX = 40;
      const startY = 40;

      const colors = ['#ef4444', '#f97316', '#eab308', '#06b6d4'];

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          aliens.push({
            x: startX + c * (alienW + padX),
            y: startY + r * (alienH + padY),
            w: alienW,
            h: alienH,
            color: colors[r],
            alive: true,
            points: (rows - r) * 10
          });
        }
      }
      alienDir = 1;
      alienSpeed = 0.9;
    }

    function initBunkers() {
      bunkers = [];
      const bunkerXs = [80, 190, 300, 410];
      bunkerXs.forEach(bx => {
        bunkers.push({ x: bx - 20, y: 340, w: 40, h: 24, hp: 6 });
      });
    }

    function startInvaders() {
      score = 0;
      lives = 3;
      player.x = 220;
      bullets = [];
      alienBullets = [];
      initAliens();
      initBunkers();
      isPlaying = true;
      document.getElementById('score').innerText = score;
      document.getElementById('lives').innerText = lives;
      document.getElementById('overlay').classList.remove('active');
      if (animId) cancelAnimationFrame(animId);
      loop();
    }

    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (e.code === 'Space' && isPlaying && bullets.length < 2) {
        bullets.push({ x: player.x + player.w / 2, y: player.y, vy: -6 });
        playTone(600, 0.04);
      }
    });
    window.addEventListener('keyup', e => { keys[e.code] = false; });

    function update() {
      // Player move
      if (keys['ArrowLeft'] || keys['KeyA']) {
        player.x = Math.max(10, player.x - player.speed);
      }
      if (keys['ArrowRight'] || keys['KeyD']) {
        player.x = Math.min(canvas.width - player.w - 10, player.x + player.speed);
      }

      // Update player bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.y += b.vy;

        // Check alien hit
        for (let j = 0; j < aliens.length; j++) {
          const a = aliens[j];
          if (!a.alive) continue;
          if (b.x >= a.x && b.x <= a.x + a.w && b.y >= a.y && b.y <= a.y + a.h) {
            a.alive = false;
            bullets.splice(i, 1);
            score += a.points;
            document.getElementById('score').innerText = score;
            playTone(400, 0.06);
            alienSpeed += 0.03;
            break;
          }
        }

        // Check bunker hit
        for (let k = 0; k < bunkers.length; k++) {
          const bk = bunkers[k];
          if (bk.hp > 0 && b.x >= bk.x && b.x <= bk.x + bk.w && b.y >= bk.y && b.y <= bk.y + bk.h) {
            bk.hp--;
            bullets.splice(i, 1);
            break;
          }
        }

        if (b.y < 0) bullets.splice(i, 1);
      }

      // Alien movement
      let hitEdge = false;
      aliens.forEach(a => {
        if (!a.alive) return;
        a.x += alienDir * alienSpeed;
        if (a.x <= 10 || a.x + a.w >= canvas.width - 10) {
          hitEdge = true;
        }
      });

      if (hitEdge) {
        alienDir *= -1;
        aliens.forEach(a => {
          if (a.alive) a.y += 14;
        });
      }

      // Alien shoot chance
      if (Math.random() < 0.035 && alienBullets.length < 3) {
        const aliveAliens = aliens.filter(a => a.alive);
        if (aliveAliens.length > 0) {
          const shooter = aliveAliens[Math.floor(Math.random() * aliveAliens.length)];
          alienBullets.push({ x: shooter.x + shooter.w / 2, y: shooter.y + shooter.h, vy: 3.5 });
        }
      }

      // Update alien bullets
      for (let i = alienBullets.length - 1; i >= 0; i--) {
        const ab = alienBullets[i];
        ab.y += ab.vy;

        // Hit player
        if (ab.x >= player.x && ab.x <= player.x + player.w && ab.y >= player.y && ab.y <= player.y + player.h) {
          alienBullets.splice(i, 1);
          lives--;
          document.getElementById('lives').innerText = lives;
          playTone(160, 0.25);
          if (lives <= 0) {
            isPlaying = false;
            document.getElementById('overlay-title').innerText = 'GAME OVER';
            document.getElementById('overlay-sub').innerText = `Final Score: ${score}`;
            document.getElementById('start-btn').innerText = 'Play Again';
            document.getElementById('overlay').classList.add('active');
            return;
          }
          continue;
        }

        // Hit bunker
        for (let k = 0; k < bunkers.length; k++) {
          const bk = bunkers[k];
          if (bk.hp > 0 && ab.x >= bk.x && ab.x <= bk.x + bk.w && ab.y >= bk.y && ab.y <= bk.y + bk.h) {
            bk.hp--;
            alienBullets.splice(i, 1);
            break;
          }
        }

        if (ab.y > canvas.height) alienBullets.splice(i, 1);
      }

      // Check alien reach bottom
      if (aliens.some(a => a.alive && a.y + a.h >= player.y)) {
        isPlaying = false;
        document.getElementById('overlay-title').innerText = 'EARTH INVADED';
        document.getElementById('overlay-sub').innerText = `Final Score: ${score}`;
        document.getElementById('start-btn').innerText = 'Try Again';
        document.getElementById('overlay').classList.add('active');
        return;
      }

      // Check wave clear
      if (aliens.every(a => !a.alive)) {
        initAliens();
        alienSpeed += 0.4;
      }
    }

    function draw() {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Player Cannon
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(player.x, player.y + 6, player.w, player.h - 6);
      ctx.fillRect(player.x + player.w / 2 - 3, player.y, 6, 8);

      // Player Bullets
      ctx.fillStyle = '#38bdf8';
      bullets.forEach(b => {
        ctx.fillRect(b.x - 1.5, b.y, 3, 8);
      });

      // Alien Bullets
      ctx.fillStyle = '#f43f5e';
      alienBullets.forEach(ab => {
        ctx.fillRect(ab.x - 1.5, ab.y, 3, 8);
      });

      // Aliens
      aliens.forEach(a => {
        if (!a.alive) return;
        ctx.fillStyle = a.color;
        // Pixel alien shape
        ctx.fillRect(a.x + 4, a.y, a.w - 8, 4);
        ctx.fillRect(a.x + 2, a.y + 4, a.w - 4, 8);
        ctx.fillRect(a.x, a.y + 12, 4, 6);
        ctx.fillRect(a.x + a.w - 4, a.y + 12, 4, 6);
        ctx.fillRect(a.x + 6, a.y + 12, 4, 4);
        ctx.fillRect(a.x + a.w - 10, a.y + 12, 4, 4);
      });

      // Bunkers
      bunkers.forEach(bk => {
        if (bk.hp <= 0) return;
        ctx.fillStyle = bk.hp > 3 ? '#16a34a' : '#ca8a04';
        ctx.fillRect(bk.x, bk.y, bk.w, bk.h);
      });
    }

    function loop() {
      if (!isPlaying) return;
      update();
      draw();
      animId = requestAnimationFrame(loop);
    }

    draw();
  </script>
</body>
</html>
