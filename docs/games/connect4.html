<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Connect 4</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }
    .header {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .title {
      font-size: 24px;
      font-weight: 800;
      color: #3b82f6;
    }
    .mode-select {
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid #334155;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
    }
    .status-bar {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .turn-disc {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      display: inline-block;
    }
    .board {
      background: #1d4ed8;
      padding: 12px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(29, 78, 216, 0.3);
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      border: 3px solid #1e40af;
    }
    .slot {
      width: min(11vw, 48px);
      height: min(11vw, 48px);
      background: #090d16;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border: 2px solid #1e3a8a;
    }
    .disc {
      width: 88%;
      height: 88%;
      border-radius: 50%;
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .disc-1 {
      background: #ef4444;
      box-shadow: inset 0 -3px 4px rgba(0,0,0,0.4), 0 0 10px #ef444488;
    }
    .disc-2 {
      background: #eab308;
      box-shadow: inset 0 -3px 4px rgba(0,0,0,0.4), 0 0 10px #eab30888;
    }
    .disc-win {
      animation: pulse 0.6s infinite alternate;
      border: 3px solid #ffffff;
    }
    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.15); }
    }
    .btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 8px 20px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 14px;
    }
    .btn:hover { background: #2563eb; }
    .help {
      margin-top: 10px;
      font-size: 11px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">CONNECT 4</div>
    <select id="mode" class="mode-select" onchange="resetGame()">
      <option value="ai">vs Smart AI</option>
      <option value="2p">2 Players (Local)</option>
    </select>
  </div>

  <div class="status-bar" id="status-bar">
    <span class="turn-disc" id="status-disc" style="background: #ef4444;"></span>
    <span id="status-text">Red's Turn</span>
  </div>

  <div class="board" id="board"></div>

  <button class="btn" onclick="resetGame()">Restart Game</button>
  <div class="help">Click any column to drop a checker</div>

  <script>
    const ROWS = 6;
    const COLS = 7;
    let grid = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));
    let currentPlayer = 1; // 1: Red, 2: Yellow
    let isGameOver = false;

    const boardEl = document.getElementById('board');

    function createBoardUI() {
      boardEl.innerHTML = '';
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const slot = document.createElement('div');
          slot.className = 'slot';
          slot.dataset.c = c;
          slot.dataset.r = r;
          slot.addEventListener('click', () => handleColumnClick(c));
          boardEl.appendChild(slot);
        }
      }
    }

    function resetGame() {
      grid = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));
      currentPlayer = 1;
      isGameOver = false;
      document.getElementById('status-disc').style.background = '#ef4444';
      document.getElementById('status-text').innerText = "Red's Turn";
      createBoardUI();
    }

    function handleColumnClick(c) {
      if (isGameOver) return;
      if (dropPiece(c, currentPlayer)) {
        const win = checkWin(currentPlayer);
        if (win) {
          endGame(win);
          return;
        }
        if (isBoardFull()) {
          document.getElementById('status-text').innerText = "Draw Game!";
          isGameOver = true;
          return;
        }

        currentPlayer = currentPlayer === 1 ? 2 : 1;
        updateStatus();

        if (currentPlayer === 2 && document.getElementById('mode').value === 'ai') {
          setTimeout(aiMove, 300);
        }
      }
    }

    function dropPiece(c, player) {
      for (let r = ROWS - 1; r >= 0; r--) {
        if (grid[r][c] === 0) {
          grid[r][c] = player;
          renderSlot(r, c, player);
          return true;
        }
      }
      return false; // Column is full
    }

    function renderSlot(r, c, player) {
      const idx = r * COLS + c;
      const slot = boardEl.children[idx];
      const disc = document.createElement('div');
      disc.className = `disc disc-${player}`;
      slot.appendChild(disc);
    }

    function updateStatus() {
      const isRed = currentPlayer === 1;
      document.getElementById('status-disc').style.background = isRed ? '#ef4444' : '#eab308';
      document.getElementById('status-text').innerText = isRed ? "Red's Turn" : (document.getElementById('mode').value === 'ai' ? "AI Thinking..." : "Yellow's Turn");
    }

    function checkWin(player) {
      // Horizontal
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS - 3; c++) {
          if (grid[r][c] === player && grid[r][c+1] === player && grid[r][c+2] === player && grid[r][c+3] === player) {
            return [[r,c], [r,c+1], [r,c+2], [r,c+3]];
          }
        }
      }
      // Vertical
      for (let r = 0; r < ROWS - 3; r++) {
        for (let c = 0; c < COLS; c++) {
          if (grid[r][c] === player && grid[r+1][c] === player && grid[r+2][c] === player && grid[r+3][c] === player) {
            return [[r,c], [r+1,c], [r+2,c], [r+3,c]];
          }
        }
      }
      // Diagonal Down-Right
      for (let r = 0; r < ROWS - 3; r++) {
        for (let c = 0; c < COLS - 3; c++) {
          if (grid[r][c] === player && grid[r+1][c+1] === player && grid[r+2][c+2] === player && grid[r+3][c+3] === player) {
            return [[r,c], [r+1,c+1], [r+2,c+2], [r+3,c+3]];
          }
        }
      }
      // Diagonal Up-Right
      for (let r = 3; r < ROWS; r++) {
        for (let c = 0; c < COLS - 3; c++) {
          if (grid[r][c] === player && grid[r-1][c+1] === player && grid[r-2][c+2] === player && grid[r-3][c+3] === player) {
            return [[r,c], [r-1,c+1], [r-2,c+2], [r-3,c+3]];
          }
        }
      }
      return null;
    }

    function isBoardFull() {
      return grid[0].every(cell => cell !== 0);
    }

    function endGame(winningSlots) {
      isGameOver = true;
      const winner = currentPlayer === 1 ? 'Red Wins!' : (document.getElementById('mode').value === 'ai' ? 'AI Wins!' : 'Yellow Wins!');
      document.getElementById('status-text').innerText = `🏆 ${winner}`;

      winningSlots.forEach(([r, c]) => {
        const idx = r * COLS + c;
        const disc = boardEl.children[idx].querySelector('.disc');
        if (disc) disc.classList.add('disc-win');
      });
    }

    function aiMove() {
      if (isGameOver) return;

      // 1. Check if AI can win immediately
      for (let c = 0; c < COLS; c++) {
        for (let r = ROWS - 1; r >= 0; r--) {
          if (grid[r][c] === 0) {
            grid[r][c] = 2;
            if (checkWin(2)) {
              grid[r][c] = 0;
              dropPiece(c, 2);
              const win = checkWin(2);
              if (win) endGame(win);
              return;
            }
            grid[r][c] = 0;
            break;
          }
        }
      }

      // 2. Check if Player can win next turn and block it
      for (let c = 0; c < COLS; c++) {
        for (let r = ROWS - 1; r >= 0; r--) {
          if (grid[r][c] === 0) {
            grid[r][c] = 1;
            if (checkWin(1)) {
              grid[r][c] = 0;
              dropPiece(c, 2);
              currentPlayer = 1;
              updateStatus();
              return;
            }
            grid[r][c] = 0;
            break;
          }
        }
      }

      // 3. Prefer center columns
      const preferred = [3, 2, 4, 1, 5, 0, 6];
      for (let c of preferred) {
        if (grid[0][c] === 0) {
          dropPiece(c, 2);
          const win = checkWin(2);
          if (win) endGame(win);
          else {
            currentPlayer = 1;
            updateStatus();
          }
          return;
        }
      }
    }

    createBoardUI();
  </script>
</body>
</html>
