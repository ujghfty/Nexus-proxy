<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Asteroids Vector</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #020617;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
      overflow: hidden;
    }
    .header {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .title {
      font-size: 24px;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: 1px;
    }
    .stats {
      display: flex;
      gap: 10px;
    }
    .stat {
      background: #0f172a;
      border: 1px solid #1e293b;
      padding: 4px 12px;
      border-radius: 6px;
      text-align: center;
    }
    .stat-l { font-size: 9px; color: #64748b; text-transform: uppercase; font-weight: 700; }
    .stat-v { font-size: 15px; font-weight: 800; color: #38bdf8; font-variant-numeric: tabular-nums; }
    #canvas-container {
      position: relative;
      border: 2px solid #1e293b;
      border-radius: 8px;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.1);
    }
    canvas {
      display: block;
      background: #020617;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 800;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 14px;
    }
    .btn:hover { background: #0369a1; }
    .help {
      margin-top: 10px;
      font-size: 11px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">ASTEROIDS</div>
    <div class="stats">
      <div class="stat">
        <div class="stat-l">Score</div>
        <div id="score" class="stat-v">0</div>
      </div>
      <div class="stat">
        <div class="stat-l">Lives</div>
        <div id="lives" class="stat-v">3</div>
      </div>
    </div>
  </div>

  <div id="canvas-container">
    <canvas id="astCanvas" width="500" height="420"></canvas>
    <div class="overlay active" id="overlay">
      <h2 style="font-size: 32px; font-weight: 800; color: #38bdf8;" id="overlay-title">Asteroids 1979</h2>
      <p style="color: #94a3b8; font-size: 13px; margin-top: 4px;" id="overlay-sub">Destroy deep-space asteroids!</p>
      <button class="btn" id="start-btn" onclick="startAsteroids()">Launch Mission</button>
    </div>
  </div>

  <div class="help">Arrows / WASD: Steer & Thrust · Space: Fire Laser</div>

  <script>
    const canvas = document.getElementById('astCanvas');
    const ctx = canvas.getContext('2d');

    let ship = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      r: 12,
      a: -Math.PI / 2,
      rot: 0,
      thrusting: false,
      thrust: { x: 0, y: 0 }
    };

    let asteroids = [];
    let lasers = [];
    let score = 0;
    let lives = 3;
    let isPlaying = false;
    let animId = null;

    function playTone(freq, dur) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    function createAsteroid(x, y, r) {
      const vert = Math.floor(Math.random() * 5 + 7);
      const offsets = [];
      for (let i = 0; i < vert; i++) {
        offsets.push(Math.random() * 0.4 + 0.8);
      }
      return {
        x, y,
        xv: (Math.random() - 0.5) * (150 / r),
        yv: (Math.random() - 0.5) * (150 / r),
        r,
        a: Math.random() * Math.PI * 2,
        rot: (Math.random() - 0.5) * 0.05,
        vert,
        offsets
      };
    }

    function spawnAsteroids(count) {
      asteroids = [];
      for (let i = 0; i < count; i++) {
        let x, y;
        do {
          x = Math.random() * canvas.width;
          y = Math.random() * canvas.height;
        } while (Math.hypot(ship.x - x, ship.y - y) < 120);
        asteroids.push(createAsteroid(x, y, 40));
      }
    }

    function startAsteroids() {
      score = 0;
      lives = 3;
      lasers = [];
      ship.x = canvas.width / 2;
      ship.y = canvas.height / 2;
      ship.thrust = { x: 0, y: 0 };
      ship.a = -Math.PI / 2;
      spawnAsteroids(4);
      isPlaying = true;
      document.getElementById('score').innerText = score;
      document.getElementById('lives').innerText = lives;
      document.getElementById('overlay').classList.remove('active');
      if (animId) cancelAnimationFrame(animId);
      loop();
    }

    function fireLaser() {
      if (!isPlaying || lasers.length > 8) return;
      lasers.push({
        x: ship.x + (4 / 3) * ship.r * Math.cos(ship.a),
        y: ship.y + (4 / 3) * ship.r * Math.sin(ship.a),
        xv: Math.cos(ship.a) * 7 + ship.thrust.x,
        yv: Math.sin(ship.a) * 7 + ship.thrust.y,
        life: 60
      });
      playTone(880, 0.05);
    }

    function update() {
      // Ship rotation
      ship.a += ship.rot;

      // Ship thrust
      if (ship.thrusting) {
        ship.thrust.x += Math.cos(ship.a) * 0.12;
        ship.thrust.y += Math.sin(ship.a) * 0.12;
      } else {
        ship.thrust.x *= 0.985;
        ship.thrust.y *= 0.985;
      }

      ship.x += ship.thrust.x;
      ship.y += ship.thrust.y;

      // Ship screen wrap
      if (ship.x < 0) ship.x = canvas.width;
      if (ship.x > canvas.width) ship.x = 0;
      if (ship.y < 0) ship.y = canvas.height;
      if (ship.y > canvas.height) ship.y = 0;

      // Update Lasers
      for (let i = lasers.length - 1; i >= 0; i--) {
        const l = lasers[i];
        l.x += l.xv;
        l.y += l.yv;
        l.life--;

        if (l.x < 0) l.x = canvas.width;
        if (l.x > canvas.width) l.x = 0;
        if (l.y < 0) l.y = canvas.height;
        if (l.y > canvas.height) l.y = 0;

        if (l.life <= 0) {
          lasers.splice(i, 1);
          continue;
        }

        // Hit asteroid check
        for (let j = asteroids.length - 1; j >= 0; j--) {
          const a = asteroids[j];
          if (Math.hypot(l.x - a.x, l.y - a.y) < a.r) {
            lasers.splice(i, 1);
            playTone(320, 0.08);

            // Split or destroy
            if (a.r > 22) {
              asteroids.push(createAsteroid(a.x, a.y, a.r / 2));
              asteroids.push(createAsteroid(a.x, a.y, a.r / 2));
              score += 20;
            } else if (a.r > 12) {
              asteroids.push(createAsteroid(a.x, a.y, a.r / 2));
              asteroids.push(createAsteroid(a.x, a.y, a.r / 2));
              score += 50;
            } else {
              score += 100;
            }

            asteroids.splice(j, 1);
            document.getElementById('score').innerText = score;

            if (asteroids.length === 0) {
              spawnAsteroids(5);
            }
            break;
          }
        }
      }

      // Update Asteroids
      for (let i = 0; i < asteroids.length; i++) {
        const a = asteroids[i];
        a.x += a.xv;
        a.y += a.yv;
        a.a += a.rot;

        if (a.x < 0 - a.r) a.x = canvas.width + a.r;
        if (a.x > canvas.width + a.r) a.x = 0 - a.r;
        if (a.y < 0 - a.r) a.y = canvas.height + a.r;
        if (a.y > canvas.height + a.r) a.y = 0 - a.r;

        // Collision with ship
        if (Math.hypot(ship.x - a.x, ship.y - a.y) < ship.r + a.r) {
          lives--;
          document.getElementById('lives').innerText = lives;
          playTone(140, 0.3);
          ship.x = canvas.width / 2;
          ship.y = canvas.height / 2;
          ship.thrust = { x: 0, y: 0 };

          if (lives <= 0) {
            isPlaying = false;
            document.getElementById('overlay-title').innerText = 'SHIP DESTROYED';
            document.getElementById('overlay-sub').innerText = `Final Score: ${score}`;
            document.getElementById('start-btn').innerText = 'Play Again';
            document.getElementById('overlay').classList.add('active');
            return;
          }
        }
      }
    }

    function draw() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Ship
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(
        ship.x + (4 / 3) * ship.r * Math.cos(ship.a),
        ship.y + (4 / 3) * ship.r * Math.sin(ship.a)
      );
      ctx.lineTo(
        ship.x - ship.r * ((2 / 3) * Math.cos(ship.a) + Math.sin(ship.a)),
        ship.y - ship.r * ((2 / 3) * Math.sin(ship.a) - Math.cos(ship.a))
      );
      ctx.lineTo(
        ship.x - ship.r * ((2 / 3) * Math.cos(ship.a) - Math.sin(ship.a)),
        ship.y - ship.r * ((2 / 3) * Math.sin(ship.a) + Math.cos(ship.a))
      );
      ctx.closePath();
      ctx.stroke();

      // Thruster flame
      if (ship.thrusting) {
        ctx.strokeStyle = '#f97316';
        ctx.beginPath();
        ctx.moveTo(
          ship.x - ship.r * ((2 / 3) * Math.cos(ship.a) + 0.5 * Math.sin(ship.a)),
          ship.y - ship.r * ((2 / 3) * Math.sin(ship.a) - 0.5 * Math.cos(ship.a))
        );
        ctx.lineTo(
          ship.x - ship.r * (5 / 3) * Math.cos(ship.a),
          ship.y - ship.r * (5 / 3) * Math.sin(ship.a)
        );
        ctx.lineTo(
          ship.x - ship.r * ((2 / 3) * Math.cos(ship.a) - 0.5 * Math.sin(ship.a)),
          ship.y - ship.r * ((2 / 3) * Math.sin(ship.a) + 0.5 * Math.cos(ship.a))
        );
        ctx.stroke();
      }

      // Draw Lasers
      ctx.fillStyle = '#f43f5e';
      ctx.shadowColor = '#f43f5e';
      ctx.shadowBlur = 6;
      lasers.forEach(l => {
        ctx.beginPath();
        ctx.arc(l.x, l.y, 2.5, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.shadowBlur = 0;

      // Draw Asteroids
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 1.5;
      asteroids.forEach(a => {
        ctx.beginPath();
        for (let j = 0; j < a.vert; j++) {
          const angle = a.a + (j * Math.PI * 2) / a.vert;
          const radius = a.r * a.offsets[j];
          const x = a.x + radius * Math.cos(angle);
          const y = a.y + radius * Math.sin(angle);
          if (j === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });
    }

    function loop() {
      if (!isPlaying) return;
      update();
      draw();
      animId = requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') ship.rot = -0.08;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') ship.rot = 0.08;
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') ship.thrusting = true;
      if (e.code === 'Space') fireLaser();
    });

    window.addEventListener('keyup', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') ship.rot = 0;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') ship.rot = 0;
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') ship.thrusting = false;
    });

    draw();
  </script>
</body>
</html>
