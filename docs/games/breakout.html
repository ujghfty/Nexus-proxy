<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Breakout Matrix</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
      overflow: hidden;
    }
    .header {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .title {
      font-size: 24px;
      font-weight: 800;
      color: #ec4899;
    }
    .metrics {
      display: flex;
      gap: 10px;
    }
    .metric {
      background: #131c2e;
      border: 1px solid #1e293b;
      padding: 4px 10px;
      border-radius: 6px;
      text-align: center;
    }
    .m-lbl { font-size: 9px; color: #64748b; font-weight: 700; text-transform: uppercase; }
    .m-val { font-size: 15px; font-weight: 800; color: #f472b6; font-variant-numeric: tabular-nums; }
    #canvas-container {
      position: relative;
      border: 2px solid #1e293b;
      border-radius: 8px;
      box-shadow: 0 0 25px rgba(236, 72, 153, 0.15);
      background: #0b1120;
    }
    canvas {
      display: block;
      background: #0b1120;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(11, 17, 32, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .btn {
      background: #ec4899;
      color: white;
      border: none;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 800;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 12px;
    }
    .btn:hover { background: #db2777; }
    .help {
      margin-top: 10px;
      font-size: 11px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">BREAKOUT</div>
    <div class="metrics">
      <div class="metric">
        <div class="m-lbl">Score</div>
        <div id="score" class="m-val">0</div>
      </div>
      <div class="metric">
        <div class="m-lbl">Lives</div>
        <div id="lives" class="m-val">3</div>
      </div>
      <div class="metric">
        <div class="m-lbl">Level</div>
        <div id="level" class="m-val">1</div>
      </div>
    </div>
  </div>

  <div id="canvas-container">
    <canvas id="breakoutCanvas" width="480" height="420"></canvas>
    <div class="overlay active" id="overlay">
      <h2 style="font-size: 28px; font-weight: 800; color: #ec4899;" id="overlay-title">Breakout</h2>
      <p style="color: #94a3b8; font-size: 13px; margin-top: 4px;" id="overlay-desc">Smash all bricks with your paddle!</p>
      <button class="btn" id="start-btn" onclick="startBreakout()">Start Game</button>
    </div>
  </div>

  <div class="help">Move mouse or Left/Right Arrow keys to control paddle</div>

  <script>
    const canvas = document.getElementById('breakoutCanvas');
    const ctx = canvas.getContext('2d');

    let paddle = { x: 200, y: 390, width: 85, height: 12, speed: 7 };
    let balls = [];
    let bricks = [];
    let particles = [];
    let powerups = [];
    let score = 0;
    let lives = 3;
    let level = 1;
    let isPlaying = false;
    let animId = null;

    function playTone(freq, dur) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    const BRICK_ROWS = 5;
    const BRICK_COLS = 8;
    const BRICK_WIDTH = 52;
    const BRICK_HEIGHT = 18;
    const BRICK_PAD = 6;
    const BRICK_TOP = 40;
    const BRICK_LEFT = (480 - (BRICK_COLS * (BRICK_WIDTH + BRICK_PAD) - BRICK_PAD)) / 2;

    const ROW_COLORS = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#06b6d4'];

    function initBricks() {
      bricks = [];
      for (let r = 0; r < BRICK_ROWS; r++) {
        for (let c = 0; c < BRICK_COLS; c++) {
          bricks.push({
            x: BRICK_LEFT + c * (BRICK_WIDTH + BRICK_PAD),
            y: BRICK_TOP + r * (BRICK_HEIGHT + BRICK_PAD),
            color: ROW_COLORS[r],
            alive: true,
            points: (BRICK_ROWS - r) * 10
          });
        }
      }
    }

    function resetBall() {
      balls = [{
        x: paddle.x + paddle.width / 2,
        y: paddle.y - 10,
        vx: (Math.random() - 0.5) * 4 || 2,
        vy: -4.5,
        radius: 6
      }];
    }

    function startBreakout() {
      score = 0;
      lives = 3;
      level = 1;
      paddle.width = 85;
      paddle.x = (canvas.width - paddle.width) / 2;
      powerups = [];
      particles = [];
      initBricks();
      resetBall();
      isPlaying = true;
      document.getElementById('score').innerText = score;
      document.getElementById('lives').innerText = lives;
      document.getElementById('level').innerText = level;
      document.getElementById('overlay').classList.remove('active');
      if (animId) cancelAnimationFrame(animId);
      loop();
    }

    function addParticles(x, y, color) {
      for (let i = 0; i < 8; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          radius: Math.random() * 3 + 1,
          color,
          alpha: 1
        });
      }
    }

    function update() {
      // Update balls
      for (let b = balls.length - 1; b >= 0; b--) {
        const ball = balls[b];
        ball.x += ball.vx;
        ball.y += ball.vy;

        // Wall collisions
        if (ball.x - ball.radius <= 0) {
          ball.x = ball.radius;
          ball.vx *= -1;
          playTone(300, 0.03);
        } else if (ball.x + ball.radius >= canvas.width) {
          ball.x = canvas.width - ball.radius;
          ball.vx *= -1;
          playTone(300, 0.03);
        }

        if (ball.y - ball.radius <= 0) {
          ball.y = ball.radius;
          ball.vy *= -1;
          playTone(300, 0.03);
        }

        // Paddle collision
        if (
          ball.y + ball.radius >= paddle.y &&
          ball.y - ball.radius <= paddle.y + paddle.height &&
          ball.x >= paddle.x &&
          ball.x <= paddle.x + paddle.width
        ) {
          ball.y = paddle.y - ball.radius;
          // Angle based on hit position
          const hit = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
          const speed = Math.hypot(ball.vx, ball.vy);
          ball.vx = hit * 4.5;
          ball.vy = -Math.sqrt(Math.max(4, speed * speed - ball.vx * ball.vx));
          playTone(450, 0.05);
        }

        // Brick collision
        for (let i = 0; i < bricks.length; i++) {
          const br = bricks[i];
          if (!br.alive) continue;

          if (
            ball.x + ball.radius > br.x &&
            ball.x - ball.radius < br.x + BRICK_WIDTH &&
            ball.y + ball.radius > br.y &&
            ball.y - ball.radius < br.y + BRICK_HEIGHT
          ) {
            br.alive = false;
            ball.vy *= -1;
            score += br.points;
            document.getElementById('score').innerText = score;
            playTone(600 + br.points * 3, 0.06);
            addParticles(br.x + BRICK_WIDTH / 2, br.y + BRICK_HEIGHT / 2, br.color);

            // Chance for powerup
            if (Math.random() < 0.2) {
              powerups.push({
                x: br.x + BRICK_WIDTH / 2,
                y: br.y + BRICK_HEIGHT / 2,
                type: Math.random() < 0.5 ? 'wide' : 'multiball'
              });
            }
            break;
          }
        }

        // Bottom boundary death
        if (ball.y - ball.radius > canvas.height) {
          balls.splice(b, 1);
        }
      }

      // Check if all balls lost
      if (balls.length === 0) {
        lives--;
        document.getElementById('lives').innerText = lives;
        playTone(180, 0.2);
        if (lives <= 0) {
          isPlaying = false;
          document.getElementById('overlay-title').innerText = 'Game Over';
          document.getElementById('overlay-desc').innerText = `Final Score: ${score}`;
          document.getElementById('start-btn').innerText = 'Play Again';
          document.getElementById('overlay').classList.add('active');
          return;
        } else {
          paddle.width = 85;
          resetBall();
        }
      }

      // Check win level
      if (bricks.every(br => !br.alive)) {
        level++;
        document.getElementById('level').innerText = level;
        playTone(800, 0.3);
        initBricks();
        resetBall();
      }

      // Update Powerups
      for (let p = powerups.length - 1; p >= 0; p--) {
        const pow = powerups[p];
        pow.y += 2;

        if (
          pow.y >= paddle.y &&
          pow.y <= paddle.y + paddle.height &&
          pow.x >= paddle.x &&
          pow.x <= paddle.x + paddle.width
        ) {
          if (pow.type === 'wide') {
            paddle.width = 120;
          } else if (pow.type === 'multiball') {
            if (balls[0]) {
              balls.push({
                x: balls[0].x,
                y: balls[0].y,
                vx: -balls[0].vx,
                vy: balls[0].vy,
                radius: 6
              });
            }
          }
          playTone(720, 0.1);
          powerups.splice(p, 1);
        } else if (pow.y > canvas.height) {
          powerups.splice(p, 1);
        }
      }

      // Update particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.alpha -= 0.03;
        if (pt.alpha <= 0) particles.splice(i, 1);
      }
    }

    function draw() {
      ctx.fillStyle = '#0b1120';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Bricks
      bricks.forEach(br => {
        if (!br.alive) return;
        ctx.fillStyle = br.color;
        ctx.fillRect(br.x, br.y, BRICK_WIDTH, BRICK_HEIGHT);
        ctx.strokeStyle = '#ffffff22';
        ctx.strokeRect(br.x, br.y, BRICK_WIDTH, BRICK_HEIGHT);
      });

      // Paddle
      ctx.fillStyle = '#ec4899';
      ctx.shadowColor = '#ec4899';
      ctx.shadowBlur = 10;
      ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
      ctx.shadowBlur = 0;

      // Balls
      balls.forEach(ball => {
        ctx.fillStyle = '#f8fafc';
        ctx.shadowColor = '#f8fafc';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      });

      // Powerups
      powerups.forEach(pow => {
        ctx.fillStyle = pow.type === 'wide' ? '#38bdf8' : '#eab308';
        ctx.fillRect(pow.x - 7, pow.y - 7, 14, 14);
      });

      // Particles
      particles.forEach(pt => {
        ctx.fillStyle = pt.color;
        ctx.globalAlpha = pt.alpha;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      });
    }

    function loop() {
      if (!isPlaying) return;
      update();
      draw();
      animId = requestAnimationFrame(loop);
    }

    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      const rootX = e.clientX - rect.left;
      paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, rootX - paddle.width / 2));
    });

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
        paddle.x = Math.max(0, paddle.x - 24);
      } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
        paddle.x = Math.min(canvas.width - paddle.width, paddle.x + 24);
      }
    });

    draw();
  </script>
</body>
</html>
